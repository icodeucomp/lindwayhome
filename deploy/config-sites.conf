# Install at /etc/nginx/sites-available/lindway, then:
#   ln -s /etc/nginx/sites-available/lindway /etc/nginx/sites-enabled/lindway
#   nginx -t && systemctl reload nginx
#
# Both sites in one file: lindwayhome.com (main) and beta.lindwayhome.com (beta). They share every
# setting and one proxy block; the map below picks the upstream by host. The ports must match
# `port=` in deploy.sh, and the certificate must list both names
# (certbot --expand -d lindwayhome.com -d www.lindwayhome.com -d beta.lindwayhome.com).

# ── Per-site settings ───────────────────────────────────────────────────────────
map $host $lw_upstream { beta.lindwayhome.com 127.0.0.1:18091; default 127.0.0.1:18090; }
# Beta is a staging copy on the live database: keep it out of search engines. An empty value
# makes add_header skip the header, so main stays indexable.
map $host $lw_robots   { beta.lindwayhome.com "noindex, nofollow"; default ""; }
map $host $lw_canonical { www.lindwayhome.com lindwayhome.com; default $host; }

# ── Access gate ───────────────────────────────────────────────────────────────
# The app is still in development and both sites run on the live database, so neither is open to
# the public. Before nginx serves anything it asks the app (auth_request, /_lw_auth below) whether
# the visitor holds a valid team session. The team signs in on /team-login with the username and
# password in the server's env file (TEAM_ACCESS_USERNAME / TEAM_ACCESS_PASSWORD); that sets the
# lw_session cookie on lindwayhome.com and beta.lindwayhome.com. Without a session,
# lindwayhome.com shows the "coming soon" page (503) and beta redirects to /team-login.
map $host $lw_is_beta { beta.lindwayhome.com 1; default 0; }

# ── Rate limiting ─────────────────────────────────────────────────────────────
# Each map turns "METHOD:/path" into a key: the client IP when the request is one we
# want to throttle, "" when it is not. nginx does not count a request with an empty
# key, so every limit below can sit on the single `location /` and only fires for its
# own endpoint. $uri is already decoded and slash-merged, so `//api/auth/login` and
# `%2fapi...` variants land on the same key as the plain path.
map "$request_method:$uri" $lw_login_key    { ~^POST:/api/(auth|team-access)/login$ $binary_remote_addr; default ""; }
map "$request_method:$uri" $lw_register_key { "POST:/api/auth/register"     $binary_remote_addr; default ""; }
map "$request_method:$uri" $lw_contact_key  { "POST:/api/contact-inquiries" $binary_remote_addr; default ""; }
map "$request_method:$uri" $lw_upload_key   { ~^POST:/api/files/            $binary_remote_addr; default ""; }  # public until F-53
map "$request_method:$uri" $lw_checkout_key { ~^[A-Z]+:/api/orders/checkout $binary_remote_addr; default ""; }  # GET quotes call Paxel too
map "$request_method:$uri" $lw_api_key {
    # Xendit retries a failed callback, so it must never be throttled.
    "POST:/api/payments/xendit/callback" "";
    ~:/api/                              $binary_remote_addr;
    default                              "";
}

limit_req_zone $lw_login_key    zone=lw_login:1m    rate=10r/m;
limit_req_zone $lw_register_key zone=lw_register:1m rate=5r/m;
limit_req_zone $lw_contact_key  zone=lw_contact:1m  rate=5r/m;
limit_req_zone $lw_upload_key   zone=lw_upload:1m   rate=20r/m;
limit_req_zone $lw_checkout_key zone=lw_checkout:1m rate=30r/m;
limit_req_zone $lw_api_key      zone=lw_api:10m     rate=300r/m;
limit_req_status 429;

server {
    listen 80;
    listen [::]:80;
    server_name lindwayhome.com www.lindwayhome.com beta.lindwayhome.com;
    return 301 https://$lw_canonical$request_uri;
}

# www over HTTPS: the certificate covers it, so redirect instead of letting it fall
# through to whichever site owns the default server on 443.
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name www.lindwayhome.com;

    ssl_certificate     /etc/letsencrypt/live/lindwayhome.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/lindwayhome.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;   # certbot's TLS protocols and ciphers
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    return 301 https://lindwayhome.com$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name lindwayhome.com beta.lindwayhome.com;

    # certbot fills these in; the certificate folder does not depend on this filename
    ssl_certificate     /etc/letsencrypt/live/lindwayhome.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/lindwayhome.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;   # certbot's TLS protocols and ciphers
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    server_tokens off;
    client_max_body_size 50m;           # default 1 MB would 413 most image uploads
    client_body_timeout 30s;            # slow-body (slowloris-style) uploads are cut off
    client_header_timeout 15s;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript image/svg+xml;

    # No Content-Security-Policy: the storefront loads OpenStreetMap tiles, Xendit's
    # hosted page and inline Next.js scripts, and a wrong CSP breaks checkout silently.
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options    "nosniff" always;
    add_header X-Frame-Options           "SAMEORIGIN" always;
    add_header Referrer-Policy           "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy        "camera=(), microphone=(), geolocation=(self)" always;
    add_header X-Robots-Tag              $lw_robots always;

    # No valid session: beta sends the visitor to the sign-in page, lindwayhome.com shows "coming
    # soon". recursive_error_pages lets the 503 below reach @lw_soon from inside @lw_denied.
    recursive_error_pages on;
    error_page 401 = @lw_denied;
    error_page 503 @lw_soon;

    location @lw_denied {
        if ($lw_is_beta) {
            add_header Cache-Control "no-store" always;
            return 302 /team-login;
        }
        return 503;
    }

    # What the gate shows. A static file, so nothing here touches the app or the database.
    location @lw_soon {
        root /opt/lindway/site;
        rewrite ^ /coming-soon.html break;
        add_header Retry-After 3600 always;
        add_header Cache-Control "no-store" always;
        add_header X-Robots-Tag $lw_robots always;   # beta only; main is a temporary 503, not noindex
        add_header X-Content-Type-Options "nosniff" always;
    }

    # The cron script calls the app on 127.0.0.1:18090 directly, so nobody needs these
    # from the internet. The x-cron-secret header is the first lock; this is the second.
    location ~ ^/api/(files|orders)/cleanup$ { return 404; }

    # Dotfiles and VCS folders: nothing legitimate lives here, and a stray one is bad.
    location ~ /\.(?!well-known) { return 404; }

    # The check nginx makes before serving anything behind the gate. 204 = let through, 401 = deny.
    location = /_lw_auth {
        internal;
        # The 401 below must reach auth_request as-is. error_page is inherited only by locations that
        # define none, so this unused one stops the server-level 401 handler from rewriting it.
        error_page 599 /lw-unused;
        if ($cookie_lw_session = "") { return 401; }   # no session at all: never wake the app for it

        proxy_pass http://$lw_upstream/api/team-access/check;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header Host              $host;
        proxy_set_header Cookie            $http_cookie;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 5s;
    }

    # The few paths that must work without a session. Each is matched on nginx's own normalised
    # path (no "..", no encoded slashes, no backslashes), never on the raw request line, so a
    # crafted URL cannot borrow one of these to reach something else.
    location = /team-login { try_files /lw-none @lw_proxy; }
    location = /favicon.ico { try_files /lw-none @lw_proxy; }
    location = /api/team-access/login {
        limit_req zone=lw_login burst=5 nodelay;
        try_files /lw-none @lw_proxy;
    }
    # Xendit's callback carries no cookie and is retried on failure, so it is never gated.
    location = /api/payments/xendit/callback { try_files /lw-none @lw_proxy; }
    # Script, style and font files the sign-in page needs. No backslash, percent or ".." can match.
    location ~ "^/_next/static/[A-Za-z0-9_./()~-]+$" { try_files /lw-none @lw_proxy; }

    # Everything else: rate limits, then the session check, then the app.
    location / {
        limit_req zone=lw_login    burst=5   nodelay;
        limit_req zone=lw_register burst=2   nodelay;
        limit_req zone=lw_contact  burst=3   nodelay;
        limit_req zone=lw_upload   burst=10  nodelay;
        limit_req zone=lw_checkout burst=10  nodelay;
        limit_req zone=lw_api      burst=100 nodelay;

        auth_request /_lw_auth;
        try_files /lw-none @lw_proxy;
    }

    location @lw_proxy {
        proxy_pass http://$lw_upstream;
        proxy_set_header Host              $host;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}
