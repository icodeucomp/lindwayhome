<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Lindway Home · Coming soon</title>
<style>
  :root { --bg: #faf6f5; --ink: #39322c; --accent: #ba8164; --rule: #d2d2ca; }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--bg);
    color: var(--ink);
    font-family: "Raleway", "Helvetica Neue", Arial, sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
    text-align: center;
  }
  main { max-width: 34rem; }
  .brand { letter-spacing: .32em; text-transform: uppercase; font-size: .8rem; color: var(--accent); margin: 0 0 2.5rem; }
  h1 { font-weight: 500; font-size: clamp(2rem, 6vw, 3.25rem); letter-spacing: .08em; text-transform: uppercase; margin: 0 0 1.25rem; }
  hr { width: 3rem; border: 0; border-top: 1px solid var(--accent); margin: 0 auto 1.5rem; }
  p { line-height: 1.7; margin: 0 0 .75rem; }
  .id { color: #6b6158; font-size: .95rem; }
  a { color: var(--accent); text-decoration: none; border-bottom: 1px solid var(--rule); }
  a:hover { border-bottom-color: var(--accent); }
  .link { margin-top: 2rem; font-size: .85rem; letter-spacing: .12em; text-transform: uppercase; }
</style>
</head>
<body>
<main>
  <p class="brand">Lindway Home</p>
  <h1>Coming soon</h1>
  <hr>
  <p>We are preparing something new. Please visit us at the main store in the meantime.</p>
  <p class="id">Kami sedang menyiapkan sesuatu yang baru. Sementara itu, silakan kunjungi toko utama kami.</p>
  <p class="link"><a href="https://lindwayhome.com">lindwayhome.com</a></p>
</main>
</body>
</html>
