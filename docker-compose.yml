# Production stack: the app plus its PostgreSQL. Secrets come from `.env` on the
# server (never committed) — see .env.example for the full list.
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-lindwayhome}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-lindway}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-lindwayhome} -d ${POSTGRES_DB:-lindway}"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build:
      context: .
      args:
        NEXT_PUBLIC_BASE_URL: ${NEXT_PUBLIC_BASE_URL:?set NEXT_PUBLIC_BASE_URL in .env}
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    env_file: .env
    environment:
      # Overrides any DATABASE_URL in .env: inside the network the host is `db`.
      DATABASE_URL: postgresql://${POSTGRES_USER:-lindwayhome}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-lindway}
      UPLOADS_PATH: /data/uploads
      SEED_ON_START: ${SEED_ON_START:-}
    ports:
      - "127.0.0.1:${APP_PORT:-18090}:4790"
    volumes:
      # Named volume, so deploys (which swap the source folder) never touch uploaded images.
      # Beta mounts this same volume by its full name, `lindway_uploads`.
      - uploads:/data/uploads
      - logs:/app/logs

volumes:
  pgdata:
  uploads:
  logs:
