# Beta stack (beta.lindwayhome.com): the app only. It shares the production database by joining
# the network of the main stack (project `lindway`, see docker-compose.yml), where the database
# answers to the name `db`, so main must be running first. Same .env, same uploads volume.
services:
  app:
    container_name: lindway-beta-app
    build:
      context: .
      args:
        NEXT_PUBLIC_BASE_URL: ${NEXT_PUBLIC_BASE_URL:?set NEXT_PUBLIC_BASE_URL in .env}
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-lindwayhome}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-lindway}
      UPLOADS_PATH: /data/uploads
      # Inside the container beta listens on 4091 (main: 4790); the host side stays 18091.
      PORT: "4091"
      # The database is shared with production, so beta never changes its schema or seeds it:
      # main applies migrations. See docker/entrypoint.sh.
      SKIP_MIGRATE: "true"
      SEED_ON_START: ""
      # Beta asks for the team password (src/proxy.ts); main never sets this. If the credentials in
      # .env are missing the gate stays shut rather than open.
      TEAM_ACCESS_GATE: "true"
    # The image's healthcheck probes 4790, so it is restated for this port.
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:4091/api >/dev/null || exit 1"]
      interval: 15s
      timeout: 5s
      start_period: 60s
      retries: 5
    ports:
      - "127.0.0.1:${APP_PORT:-18091}:4091"
    volumes:
      - uploads:/data/uploads
      - logs:/app/logs

networks:
  default:
    name: lindway_default
    external: true

volumes:
  # Main's volume, so an image uploaded on one site shows on the other.
  uploads:
    name: lindway_uploads
    external: true
  logs:
